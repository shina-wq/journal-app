<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Rubik:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="dist/journal.js"></script>
  </head>
  <body>
    <div class="app" data-view="list">
      <header class="toolbar">
        <button type="button" id="new-entry" class="icon-btn" aria-label="New entry">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </header>

      <aside class="sidebar" aria-label="Entries">
        <label class="filter">
          <span class="sr-only">Filter by mood</span>
          <select id="mood-filter">
            <option value="all">All entries</option>
          </select>
        </label>
        <label class="search">
          <span class="sr-only">Search entries</span>
          <input type="search" id="search" placeholder="Search entries" autocomplete="off" />
        </label>
        <ul id="entry-list" class="entry-list"></ul>
      </aside>

      <main class="page">
        <form id="entry-form" class="entry-form">
          <div class="page-head">
            <button type="button" id="back" class="icon-btn subtle back-btn" aria-label="Back to entries">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </button>
            <time id="entry-date"></time>
            <button type="button" id="delete-entry" class="icon-btn subtle" aria-label="Delete entry" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6" />
              </svg>
            </button>
          </div>

          <label class="sr-only" for="title">Title</label>
          <input id="title" name="title" class="title-input" placeholder="Untitled" autocomplete="off" required pattern=".*\S.*" maxlength="120" />

          <fieldset id="moods" class="moods">
            <legend class="sr-only">Mood</legend>
          </fieldset>

          <label class="sr-only" for="content">Entry</label>
          <textarea id="content" name="content" class="content-input" placeholder="What's on your mind?"></textarea>

          <div class="form-footer">
            <p id="status" class="status" role="status"></p>
            <button type="submit" class="save-btn">Save entry</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
