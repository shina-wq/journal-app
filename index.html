<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <!-- Applies a saved dark theme before first paint to avoid a light flash; journal.ts takes over after -->
    <script>
      if (localStorage.getItem('journal.theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    </script>
    <script type="module" src="dist/journal.js"></script>
  </head>
  <body>
    <div class="app" data-view="list">
      <aside class="sidebar" aria-label="Entries">
        <div class="sidebar-head">
          <h1 class="app-title">Journal</h1>
          <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch theme">
            <svg class="theme-icon" data-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
            <svg class="theme-icon" data-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          </button>
          <button type="button" id="new-entry" class="icon-btn" aria-label="New entry" title="New entry">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6" />
              <path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z" />
            </svg>
          </button>
        </div>
        <label class="search">
          <span class="sr-only">Search entries</span>
          <input type="search" id="search" placeholder="Search" autocomplete="off" />
        </label>
        <fieldset id="mood-filter" class="filters">
          <legend class="sr-only">Filter by mood</legend>
          <label class="filter-chip">
            <input type="radio" name="filter" value="all" checked />
            All
          </label>
        </fieldset>
        <ul id="entry-list" class="entry-list"></ul>
      </aside>

      <main class="page">
        <form id="entry-form" class="entry-form">
          <div class="page-head">
            <button type="button" id="back" class="icon-btn back-btn" aria-label="Back to entries">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </button>
            <time id="entry-date"></time>
            <button type="button" id="delete-entry" class="icon-btn" aria-label="Delete entry" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6" />
              </svg>
            </button>
          </div>

          <label class="sr-only" for="title">Title</label>
          <textarea id="title" name="title" class="title-input" rows="1" placeholder="Untitled" autocomplete="off" required maxlength="120"></textarea>

          <fieldset id="moods" class="moods">
            <legend class="sr-only">Mood</legend>
          </fieldset>

          <label class="sr-only" for="content">Entry</label>
          <textarea id="content" name="content" class="content-input" placeholder="What's on your mind?"></textarea>

          <div class="form-footer">
            <button type="button" id="shuffle-prompt" class="prompt-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22M18 2l4 4-4 4M2 6h1.9c1.5 0 2.9.9 3.6 2.2M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8M18 14l4 4-4 4" />
              </svg>
              New prompt
            </button>
            <p id="status" class="status" role="status"></p>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
